version: 2

blocks:
  - type: prompt
    alignment: left
    segments:

      - type: time
        style: plain
        foreground: "#7F849C"
        properties:
          time_format: "15:04"
        template: "[{{ .CurrentDate | date .Format }}]"

      # --- Current path ---
      - type: path
        style: plain
        foreground: "#A6E3A1"
        properties:
          style: agnoster_short
          max_depth: 1 

      # --- Python environment (venv / uv) ---
      - type: python
        style: plain
        foreground: "#f5f57a"
        template: " {{ .Venv }}"

      # --- Git status ---
      - type: git
        style: plain
        foreground: "#ff6d54"
        template: " \uf418 {{ .HEAD }}{{ if .Working.Changed }}*{{ end }}"
        properties:
          branch_icon: ""

      # --- Execution time ---
      - type: executiontime
        style: plain
        foreground: "#C586C0"
        properties:
          threshold: 500
        template: " ⏱  {{ .FormattedMs }}"

  # --- Prompt symbol ---
  - type: prompt
    alignment: left
    newline: false
    segments:
      - type: text
        style: plain
        foreground: "#FFFFFF"
        template: " ❯ "